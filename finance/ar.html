<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>MamaVege | 客户账目 AR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#F5F6F8;
  --panel:#FFFFFF;
  --ink:#182033;
  --muted:#6B7280;
  --faint:#9AA3B2;
  --sidebar:#0F1830;
  --sidebar-line:#26314D;
  --sidebar-text:#B9C2D6;
  --sidebar-text-dim:#7C879E;
  --accent:#1F7A6C;
  --accent-soft:#E4F2EF;
  --danger:#C1442D;
  --danger-soft:#FAE6E1;
  --warn:#B7791F;
  --warn-soft:#FBF0DD;
  --line:#E4E7EC;
  --line-soft:#EEF0F3;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,24,48,.06), 0 8px 24px -12px rgba(16,24,48,.12);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',-apple-system,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.num{
  font-family:'IBM Plex Mono',monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.01em;
}
h1,h2,h3,.display{
  font-family:'Space Grotesk',sans-serif;
  letter-spacing:-0.01em;
}
button{font-family:inherit;}
::selection{background:var(--accent);color:#fff;}

/* ---------- layout ---------- */
#app{display:flex;height:100vh;overflow:hidden;}

/* Sidebar */
#sidebar{
  width:288px;flex:none;
  background:var(--sidebar);
  color:var(--sidebar-text);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--sidebar-line);
}
.brand-mark{
  font-family:'Space Grotesk',sans-serif;
  font-size:17px;font-weight:700;color:#fff;
  display:flex;align-items:center;gap:8px;
}
.brand-mark .dot{width:8px;height:8px;border-radius:2px;background:var(--accent);display:inline-block;}
.brand-sub{font-size:11.5px;color:var(--sidebar-text-dim);margin-top:4px;letter-spacing:.02em;}

.nav-item{
  padding:12px 20px;cursor:pointer;
  font-size:13.5px;color:var(--sidebar-text);
  border-left:3px solid transparent;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-item:hover{background:rgba(255,255,255,.04);}
.nav-item.active{background:rgba(31,122,108,.16);border-left-color:var(--accent);color:#fff;font-weight:600;}

.cust-header{
  padding:16px 20px 8px;
  display:flex;align-items:center;justify-content:space-between;
}
.cust-header span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sidebar-text-dim);font-weight:600;}
#addCustBtn{
  background:none;border:1px solid var(--sidebar-line);color:var(--sidebar-text);
  width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
#addCustBtn:hover{background:rgba(255,255,255,.06);color:#fff;}

#custSearch{
  margin:0 20px 8px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--sidebar-line);
  color:#fff;border-radius:8px;
  padding:7px 10px;font-size:12.5px;width:calc(100% - 40px);
  outline:none;
}
#custSearch::placeholder{color:var(--sidebar-text-dim);}

#custList{flex:1;overflow-y:auto;padding:0 10px 16px;}
.cust-row{
  padding:10px 10px;margin-bottom:2px;border-radius:8px;cursor:pointer;
}
.cust-row:hover{background:rgba(255,255,255,.05);}
.cust-row.active{background:rgba(31,122,108,.2);}
.cust-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.cust-name{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cust-balance{font-size:12.5px;}
.cust-row-bar{
  margin-top:7px;height:4px;border-radius:3px;overflow:hidden;
  background:rgba(255,255,255,.08);display:flex;
}
.cust-row-bar span{height:100%;display:block;}
.cust-row-meta{margin-top:5px;font-size:10.5px;color:var(--sidebar-text-dim);}

/* Main */
#main{flex:1;overflow-y:auto;background:var(--bg);}
.topbar{
  position:sticky;top:0;z-index:5;
  background:var(--bg);
  padding:22px 36px 14px;
  border-bottom:1px solid var(--line);
}
.topbar h1{font-size:22px;margin:0 0 2px;font-weight:700;}
.topbar .sub{color:var(--muted);font-size:13px;}
.content{padding:24px 36px 60px;}

/* cards */
.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);
}
.card .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.card .value{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-top:6px;}
.card .value.danger{color:var(--danger);}
.card .value.accent{color:var(--accent);}
.card .foot{font-size:11.5px;color:var(--faint);margin-top:4px;}

.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;
}
.panel-head{
  padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.panel-head h3{font-size:14.5px;margin:0;font-weight:700;}
.panel-body{padding:4px 18px 16px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line);
}
td{padding:10px 8px;border-bottom:1px solid var(--line-soft);}
tr:last-child td{border-bottom:none;}
tr.row-link{cursor:pointer;}
tr.row-link:hover td{background:var(--line-soft);}
.right{text-align:right;}
.empty-row td{text-align:center;color:var(--faint);padding:26px 8px;}

.badge{
  display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;
}
.badge.ok{background:var(--accent-soft);color:var(--accent);}
.badge.warn{background:var(--warn-soft);color:var(--warn);}
.badge.danger{background:var(--danger-soft);color:var(--danger);}
.badge.neutral{background:var(--line-soft);color:var(--muted);}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tab{
  padding:9px 4px;margin-right:22px;cursor:pointer;font-size:13.5px;color:var(--muted);
  border-bottom:2px solid transparent;font-weight:600;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);}

/* buttons */
.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;
}
.btn:hover{background:var(--line-soft);}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-primary:hover{background:#000;}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-accent:hover{opacity:.9;}
.btn-danger{color:var(--danger);border-color:var(--danger-soft);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);}
.btn-ghost:hover{background:var(--line-soft);color:var(--ink);}

/* forms */
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
  font-size:13px;font-family:inherit;color:var(--ink);background:#fff;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.hint{font-size:11px;color:var(--faint);margin-top:4px;}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(15,20,36,.45);
  display:none;align-items:center;justify-content:center;z-index:50;
  padding:20px;
}
.overlay.show{display:flex;}
.modal{
  background:#fff;border-radius:12px;width:100%;max-width:440px;
  box-shadow:0 24px 60px -12px rgba(15,20,36,.35);
  max-height:88vh;overflow-y:auto;
}
.modal-head{
  padding:18px 22px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{margin:0;font-size:15.5px;}
.modal-close{cursor:pointer;color:var(--faint);font-size:18px;background:none;border:none;}
.modal-body{padding:18px 22px;}
.modal-foot{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;}

.empty-state{
  text-align:center;padding:70px 20px;color:var(--muted);
}
.empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:19px;color:var(--ink);font-weight:700;margin-bottom:6px;}
.empty-state .btn{margin-top:16px;}

.type-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--line-soft);border-radius:20px;padding:4px 10px 4px 12px;font-size:12px;margin:0 6px 6px 0;
}
.type-chip button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;padding:0;line-height:1;}
.type-chip button:hover{color:var(--danger);}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:99;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.section-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:26px 0 10px;}
.section-title:first-child{margin-top:0;}

@media (max-width:900px){
  #sidebar{width:220px;}
  .grid-cards{grid-template-columns:repeat(2,1fr);}
  .content{padding:18px;}
}
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div class="brand">
      <div class="brand-mark"><span class="dot"></span>账目台账</div>
      <div class="brand-sub">MAMAVEGE · 连锁客户应收账款</div>
      <div class="brand-sub" style="margin-top:6px;color:var(--sidebar-text-dim);">☁️ 云端数据 · <span id="mvUserTag"></span></div>
      <div style="margin-top:8px;display:flex;gap:12px;">
        <a href="index.html" style="color:var(--sidebar-text-dim);font-size:11px;text-decoration:none;">← 财务板块</a>
        <a href="#" onclick="MVAuth.logout();return false;" style="color:var(--sidebar-text-dim);font-size:11px;text-decoration:none;">登出</a>
      </div>
    </div>
    <div class="nav-item" id="navDashboard">总览仪表盘</div>
    <div class="nav-item" id="navProducts">📦 产品成本表</div>
    <div class="nav-item" id="navShipping">🚚 运输费</div>
    <div class="nav-item" id="navMonthlySummary">🗓️ 月度汇总</div>
    <div style="padding:12px 20px 4px;display:flex;gap:8px;">
      <button class="btn btn-sm" id="saveBtn" style="flex:1;background:rgba(255,255,255,.06);border-color:var(--sidebar-line);color:#fff;">💾 保存</button>
      <button class="btn btn-sm" id="exportBtn" style="flex:1;background:rgba(255,255,255,.06);border-color:var(--sidebar-line);color:#fff;">⭳ 导出</button>
    </div>
    <div id="lastSaved" style="padding:0 20px 10px;font-size:10.5px;color:var(--sidebar-text-dim);"></div>
    <div class="cust-header">
      <span>客户</span>
      <button id="addCustBtn" title="新增客户">+</button>
    </div>
    <input id="custSearch" placeholder="搜索客户…" oninput="renderCustList()">
    <div style="margin:0 20px 10px;display:flex;gap:6px;">
      <select id="agentFilterSelect" onchange="setAgentFilter(this.value)" style="flex:1;background:rgba(255,255,255,.06);border:1px solid var(--sidebar-line);color:#fff;border-radius:8px;padding:6px 8px;font-size:12px;"></select>
      <button id="manageAgentsBtn" title="管理Agent" style="background:rgba(255,255,255,.06);border:1px solid var(--sidebar-line);color:var(--sidebar-text);width:30px;border-radius:8px;cursor:pointer;">⚙</button>
    </div>
    <div id="custList"></div>
  </div>

  <div id="main">
    <div class="topbar">
      <h1 id="pageTitle">总览仪表盘</h1>
      <div class="sub" id="pageSub">所有客户应收账款一览</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script src="../supabase.min.js"></script>
<script src="../js/auth/auth.js"></script>
<script>
/* ============================================================
   数据层
============================================================ */
const PRESET_DEDUCTION_TYPES = [
  'Unconditional Rebate 无条件返利',
  'DC Charges / DC Rebates',
  'Fixed Rebate 固定返利',
  'Trade Discount 贸易折扣',
  'A&P Funding / A&P Fee 广告推广费',
  'B2B Subscription Fee 月费',
  'Listing Fee 上架费',
  'Pallet Rental Charges 栈板租金',
  'Logistic Fee / Transport Charges 物流运费',
  'Instore Fee / Instore Promo 店内推广费',
  'Store Refit / New Store Support 装修开店支持费',
  'Autopay Charges',
  'Scan Rebate / Scan Sales Rebate',
  'Prompt Rebate',
  'Anniversary Rebate',
  'CONTRA 账目互抵',
  'Stamping Duties 印花税',
  'Compensation 补偿款',
];
const RETURN_CODES = [
  {code:'SHCR', label:'SHCR · 短装/破损'},
  {code:'DCN',  label:'DCN · 配送中心退货'},
  {code:'SHTY', label:'SHTY · 过期/临期'},
  {code:'CLM',  label:'CLM · 索赔'},
  {code:'KPM',  label:'KPM · 其他扣货'},
  {code:'OTHER',label:'其他'},
];

let customers = [];           // [{id,name,termDays,note,createdAt}]
let dataCache = {};           // id -> {invoices,deductions,returns,payments,types,shippingBatches}
let currentCustomerId = null; // null = dashboard/products
let currentTab = 'overview';
let currentView = 'dashboard'; // 'dashboard' | 'products' | 'customer'
let products = [];            // 全局产品成本表 [{id,name,unit,unitCost}]
let agents = [];              // 全局Agent清单 [{id,name}]
let shippingBatches = [];     // 全局运输批次 [{id,date,totalCost,method,note,items:[{customerId,invoiceId}]}]
let agentFilter = null;       // 当前筛选的Agent id,null = 全部
let salesSummaryMode = 'month'; // 'day' | 'month'
let salesSummaryDay = todayISO();
let salesSummaryMonth = todayISO().slice(0,7);

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- 云端存储封装(Supabase ar_state 表,key/value 与旧版 localStorage 完全同构) ---------- */
const LS_PREFIX = 'ov-ledger:';
let MV_SUPA = null, MV_EMAIL = '';
let _stateCache = null;
async function loadStateCache(){
  const {data, error} = await MV_SUPA.from('ar_state').select('key,value');
  if(error) throw error;
  _stateCache = new Map((data||[]).map(r=>[r.key, r.value]));
}
async function lsGet(key){
  if(!_stateCache) throw new Error('云端数据尚未加载');
  const k = LS_PREFIX+key;
  return _stateCache.has(k) ? {key, value:_stateCache.get(k)} : null;
}
async function lsSet(key,value){
  if(!_stateCache) throw new Error('云端数据尚未加载,禁止写入');
  const k = LS_PREFIX+key;
  _stateCache.set(k, value);
  const {error} = await MV_SUPA.from('ar_state').upsert({key:k, value, updated_at:new Date().toISOString(), updated_by:MV_EMAIL});
  if(error){ toast('⚠️ 云端保存失败:'+error.message); throw error; }
  return {key,value};
}
async function lsDelete(key){
  const k = LS_PREFIX+key;
  _stateCache && _stateCache.delete(k);
  const {error} = await MV_SUPA.from('ar_state').delete().eq('key', k);
  if(error){ toast('⚠️ 云端删除失败:'+error.message); throw error; }
  return {key,deleted:true};
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){
  n = Number(n)||0;
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'−':'')+'RM '+s;
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function daysBetween(a,b){
  const da = new Date(a+'T00:00:00'), db = new Date(b+'T00:00:00');
  return Math.round((db-da)/86400000);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'),2200);
}

async function loadAll(){
  try{
    const res = await lsGet('customers');
    customers = res ? JSON.parse(res.value) : [];
  }catch(e){ customers = []; }
  try{
    const res = await lsGet('products');
    products = res ? JSON.parse(res.value) : [];
  }catch(e){ products = []; }
  products.forEach(p=>{
    if(p.baseCost===undefined && p.unitCost!==undefined){
      p.baseCost = p.unitCost;
      p.laborCost = 0;
      p.otherCost = 0;
    }
  });
  try{
    const res = await lsGet('agents');
    agents = res ? JSON.parse(res.value) : [];
  }catch(e){ agents = []; }
  if(!agents.length){
    agents = ['Offline-Vege','GT-Carol','Online','International','Other'].map(name=>({id:uid(), name}));
    await saveAgents();
  }
  try{
    const res = await lsGet('shipping-batches');
    shippingBatches = res ? JSON.parse(res.value) : [];
  }catch(e){ shippingBatches = []; }
  await Promise.all(customers.map(c=>ensureCustomerData(c.id)));
  // 迁移:把旧版"客户专属"的运输批次搬到全局清单里(带上customerId)
  let migrated = false;
  customers.forEach(c=>{
    const d = dataCache[c.id];
    if(d && Array.isArray(d.shippingBatches) && d.shippingBatches.length){
      d.shippingBatches.forEach(old=>{
        shippingBatches.push({
          id: old.id || uid(),
          date: old.date,
          totalCost: old.totalCost,
          method: old.method,
          note: old.note || '',
          items: (old.invoiceIds||[]).map(iid=>({customerId:c.id, invoiceId:iid}))
        });
        migrated = true;
      });
      d.shippingBatches = [];
    }
  });
  if(migrated){
    await saveShippingBatches();
    await Promise.all(customers.map(c=>saveCustData(c.id)));
  }
}
async function ensureCustomerData(id){
  if(dataCache[id]) return dataCache[id];
  try{
    const res = await lsGet('cust-data:'+id);
    dataCache[id] = res ? JSON.parse(res.value) : blankCustData();
  }catch(e){
    dataCache[id] = blankCustData();
  }
  if(!Array.isArray(dataCache[id].shippingBatches)) dataCache[id].shippingBatches = [];
  return dataCache[id];
}
function blankCustData(){
  return {invoices:[],deductions:[],returns:[],payments:[],types:[],shippingBatches:[]};
}
async function saveProducts(){
  await lsSet('products', JSON.stringify(products));
}
async function saveAgents(){
  await lsSet('agents', JSON.stringify(agents));
}
async function saveShippingBatches(){
  await lsSet('shipping-batches', JSON.stringify(shippingBatches));
}
function getAgent(id){ return agents.find(a=>a.id===id); }
function agentName(c){ return c && c.agentId ? (getAgent(c.agentId)?.name || '未分配') : '未分配'; }
async function saveCustomers(){
  await lsSet('customers', JSON.stringify(customers));
  markSaved();
}
async function saveCustData(id){
  await lsSet('cust-data:'+id, JSON.stringify(dataCache[id]));
  markSaved();
}
function markSaved(){
  const el = document.getElementById('lastSaved');
  if(!el) return;
  const now = new Date();
  el.textContent = '已保存 · '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
async function manualSave(){
  await saveCustomers();
  await Promise.all(customers.map(c=>saveCustData(c.id)));
  toast('已保存全部数据');
}

/* ---------- 全部数据导出 ---------- */
function exportAllJSON(){
  const backup = {exportedAt:new Date().toISOString(), customers, products, agents, shippingBatches, data:dataCache};
  const blob = new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  downloadBlob(blob, `账目备份_${todayISO()}.json`);
}
function exportAllCSV(){

  const url = URL.createObjectURL(blob);

  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   计算逻辑:余额 & 账龄(简化 FIFO)
============================================================ */
function getRecordInvoiceIds(r){
  if(Array.isArray(r.invoiceIds)) return r.invoiceIds;
  if(r.invoiceId) return [r.invoiceId];
  return [];
}
function getInvoiceById(id, invId){
  return (dataCache[id]?.invoices||[]).find(i=>i.id===invId) || null;
}
// 把一笔记录(扣款/退货/收款)的金额,按其勾选的发票(日期从早到晚)依次分摊冲销
function allocateRecord(id, r){
  const ids = getRecordInvoiceIds(r);
  const alloc = {};
  let remaining = Number(r.amount||0);
  if(!ids.length) return {alloc, leftover:remaining};
  const invs = ids.map(iid=>getInvoiceById(id,iid)).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));
  for(const inv of invs){
    if(remaining<=0.005) break;
    const take = Math.min(remaining, Number(inv.amount||0));
    alloc[inv.id] = (alloc[inv.id]||0) + take;
    remaining -= take;
  }
  return {alloc, leftover:remaining};
}
function allInvoiceAllocations(id){
  const d = dataCache[id] || blankCustData();
  const perInvoice = {}; // invoiceId -> total linked amount
  let unlinkedPool = 0;
  [...d.deductions,...d.returns,...d.payments].forEach(r=>{
    const {alloc, leftover} = allocateRecord(id, r);
    Object.entries(alloc).forEach(([iid,amt])=>{ perInvoice[iid] = (perInvoice[iid]||0) + amt; });
    unlinkedPool += leftover;
  });
  return {perInvoice, unlinkedPool};
}
function invoiceStatus(id, inv){
  const {perInvoice} = allInvoiceAllocations(id);
  const linked = perInvoice[inv.id] || 0;
  const remaining = Number(inv.amount||0) - linked;
  let status = 'unpaid';
  if(remaining<=0.005) status='settled';
  else if(linked>0.005) status='partial';
  return {linked, remaining, status};
}
function computeSummary(id){
  const d = dataCache[id] || blankCustData();
  const totalInv = d.invoices.reduce((s,x)=>s+Number(x.amount||0),0);
  const totalDed = d.deductions.reduce((s,x)=>s+Number(x.amount||0),0);
  const totalRet = d.returns.reduce((s,x)=>s+Number(x.amount||0),0);
  const totalPay = d.payments.reduce((s,x)=>s+Number(x.amount||0),0);
  const balance = totalInv - totalDed - totalRet - totalPay;

  // 账龄判定:优先按“关联发票”精确冲销,剩下未关联(或超额)的部分按 FIFO 冲销最早的发票
  const invs = [...d.invoices].sort((a,b)=>a.date.localeCompare(b.date));
  const {perInvoice, unlinkedPool} = allInvoiceAllocations(id);
  let pool = unlinkedPool;
  let oldestUnpaid = null;
  let unpaidAmount = 0;
  for(const inv of invs){
    const linked = perInvoice[inv.id] || 0;
    let remaining = Number(inv.amount||0) - linked;
    if(remaining <= 0.005) continue;
    if(pool >= remaining){
      pool -= remaining;
    } else {
      oldestUnpaid = inv.date;
      unpaidAmount = remaining - pool;
      pool = 0;
      break;
    }
  }
  const term = getCustomer(id)?.termDays ?? 30;
  let daysOverdue = 0, status = 'ok';
  if(oldestUnpaid && balance > 0.005){
    const dueDate = new Date(oldestUnpaid+'T00:00:00');
    dueDate.setDate(dueDate.getDate()+Number(term));
    const diff = daysBetween(dueDate.toISOString().slice(0,10), todayISO());
    daysOverdue = Math.max(0,diff);
    status = daysOverdue>0 ? 'overdue' : 'ok';
  } else if (balance > 0.005){
    status = 'ok';
  }
  return {totalInv,totalDed,totalRet,totalPay,balance,oldestUnpaid,daysOverdue,status,term};
}
function getCustomer(id){ return customers.find(c=>c.id===id); }

/* ============================================================
   毛利分析:成本明细 + 运输费分摊 + 单据/客户毛利
============================================================ */
function getProduct(pid){ return products.find(p=>p.id===pid); }
function productLaborTiers(p){
  if(p.laborTiers && p.laborTiers.length) return [...p.laborTiers].sort((a,b)=>a.minQty-b.minQty);
  if(p.laborCost!==undefined) return [{minQty:0, rate:Number(p.laborCost)||0}]; // 旧数据兼容(单一固定人工费)
  return [{minQty:0, rate:0}];
}
function productLaborRate(p, monthlyQty){
  const tiers = productLaborTiers(p);
  let rate = tiers[0].rate;
  for(const t of tiers){
    if(monthlyQty >= t.minQty) rate = t.rate; else break;
  }
  return rate;
}
// 某产品在某个月(YYYY-MM),全公司(所有客户合计)卖出的数量
function companyMonthlyQtyForProduct(productId, monthKey){
  let total = 0;
  customers.forEach(c=>{
    const d = dataCache[c.id];
    if(!d) return;
    d.invoices.forEach(inv=>{
      if(!inv.date || inv.date.slice(0,7)!==monthKey) return;
      (inv.costItems||[]).forEach(ci=>{
        if(ci.productId===productId) total += Number(ci.qty)||0;
      });
    });
  });
  return total;
}
function invoiceCostTotal(inv){
  const monthKey = inv.date ? inv.date.slice(0,7) : '';
  return (inv.costItems||[]).reduce((s,ci)=>{
    const qty = Number(ci.qty)||0;
    if(ci.baseOtherCost !== undefined){
      const product = getProduct(ci.productId);
      let laborRate = 0;
      if(product){
        const monthlyQty = companyMonthlyQtyForProduct(ci.productId, monthKey);
        laborRate = productLaborRate(product, monthlyQty);
      }
      return s + qty*(Number(ci.baseOtherCost)||0) + qty*laborRate;
    }
    // 旧格式成本明细(整体单位成本已锁死,不再动态变化)
    return s + qty*(Number(ci.unitCost)||0);
  },0);
}
// batch.items = [{customerId, invoiceId}, ...] 支持跨客户
function allocateShippingBatch(batch){
  const items = (batch.items||[]).map(it=>{
    const inv = getInvoiceById(it.customerId, it.invoiceId);
    return inv ? {key: it.customerId+'|'+it.invoiceId, amount:Number(inv.amount||0)} : null;
  }).filter(Boolean);
  const alloc = {};
  if(!items.length) return alloc;
  if(batch.method==='even'){
    const per = Number(batch.totalCost||0) / items.length;
    items.forEach(it=>{ alloc[it.key] = (alloc[it.key]||0) + per; });
  } else {
    const totalSales = items.reduce((s,it)=>s+it.amount,0);
    if(totalSales <= 0.005){
      const per = Number(batch.totalCost||0) / items.length;
      items.forEach(it=>{ alloc[it.key] = (alloc[it.key]||0) + per; });
    } else {
      items.forEach(it=>{
        const share = Number(batch.totalCost||0) * (it.amount/totalSales);
        alloc[it.key] = (alloc[it.key]||0) + share;
      });
    }
  }
  return alloc;
}
function invoiceShippingTotal(id, invoiceId){
  let total = 0;
  const key = id+'|'+invoiceId;
  shippingBatches.forEach(b=>{
    const alloc = allocateShippingBatch(b);
    total += alloc[key] || 0;
  });
  return total;
}
function shippingBatchesForCustomer(id){
  return shippingBatches.filter(b => (b.items||[]).some(it=>it.customerId===id));
}
function invoiceLinkedDedRet(id, invoiceId){
  const d = dataCache[id] || blankCustData();
  let total = 0;
  [...d.deductions, ...d.returns].forEach(r=>{
    const {alloc} = allocateRecord(id, r);
    total += alloc[invoiceId] || 0;
  });
  return total;
}
function invoiceProfit(id, inv){
  const sales = Number(inv.amount||0);
  const cost = invoiceCostTotal(inv);
  const shipping = invoiceShippingTotal(id, inv.id);
  const dedRet = invoiceLinkedDedRet(id, inv.id);
  const profit = sales - cost - shipping - dedRet;
  const margin = sales>0.005 ? (profit/sales*100) : null;
  return {sales, cost, shipping, dedRet, profit, margin};
}
function computeProfitSummary(id){
  const d = dataCache[id] || blankCustData();
  let sales=0, cost=0, shipping=0, dedRet=0;
  d.invoices.forEach(inv=>{
    const p = invoiceProfit(id, inv);
    sales += p.sales; cost += p.cost; shipping += p.shipping; dedRet += p.dedRet;
  });
  const profit = sales - cost - shipping - dedRet;
  const margin = sales>0.005 ? (profit/sales*100) : null;
  return {sales, cost, shipping, dedRet, profit, margin};
}

function agingBarSegments(id){
  // 简易展示:按余额与逾期天数上色的一段条
  const s = computeSummary(id);
  if(s.balance<=0.005) return [{color:'var(--line)',pct:100}];
  if(s.daysOverdue<=0) return [{color:'var(--accent)',pct:100}];
  if(s.daysOverdue<=30) return [{color:'var(--warn)',pct:100}];
  return [{color:'var(--danger)',pct:100}];
}

function statusBadge(s){
  if(s.balance<=0.005) return `<span class="badge neutral">已结清</span>`;
  if(s.status==='overdue') return `<span class="badge ${s.daysOverdue>30?'danger':'warn'}">逾期 ${s.daysOverdue} 天</span>`;
  return `<span class="badge ok">账期内</span>`;
}
function isOverCreditLimit(c, s){
  return c && c.creditLimit>0 && s.balance > c.creditLimit;
}
function creditLimitBadge(c, s){
  if(!isOverCreditLimit(c,s)) return '';
  return `<span class="badge danger">超额度 +${fmtMoney(s.balance - c.creditLimit)}</span>`;
}

function productTotalCost(p, monthlyQty){
  const labor = productLaborRate(p, monthlyQty||0);
  return Number(p.baseCost||0)+labor+Number(p.otherCost||0);
}
function laborTiersSummary(p){
  const tiers = productLaborTiers(p);
  if(tiers.length===1) return fmtMoney(tiers[0].rate);
  return tiers.map((t,i)=> i===0 ? `${fmtMoney(t.rate)}` : `${t.minQty}+:${fmtMoney(t.rate)}`).join(' · ');
}

function salesQtyByProduct(mode, period){
  const result = {};
  customers.forEach(c=>{
    const d = dataCache[c.id];
    if(!d) return;
    d.invoices.forEach(inv=>{
      const match = mode==='day' ? inv.date===period : inv.date.slice(0,7)===period;
      if(!match) return;
      (inv.costItems||[]).forEach(ci=>{
        result[ci.productId] = (result[ci.productId]||0) + (Number(ci.qty)||0);
      });
    });
  });
  return result;
}

  const mode = salesSummaryMode;
  const period = mode==='day' ? salesSummaryDay : salesSummaryMonth;

  const sorted = [...products].sort((a,b)=>a.name.localeCompare(b.name));

          </div>
          ${mode==='day'
            ? `<input type="date" value="${salesSummaryDay}" onchange="setSalesSummaryPeriod(this.value)" style="border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;">`
            : `<input type="month" value="${salesSummaryMonth}" onchange="setSalesSummaryPeriod(this.value)" style="border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;">`

        <p class="hint" style="margin:0 0 10px;">数量来自发票"成本明细"里录入的产品数量,按产品分开统计。</p>
        <table>
          <thead><tr><th>产品</th><th class="right">${mode==='day'?'当日销量':'当月销量'}</th>${mode==='month'?'<th class="right">月度目标</th><th style="min-width:140px;">进度</th>':''}</tr></thead>
          <tbody>
          ${sorted.length ? sorted.map(p=>{
            const qty = qtyMap[p.id]||0;

              return `<tr><td>${escapeHtml(p.name)}</td><td class="right num" style="font-weight:600;">${qty||'—'}${p.unit?' '+escapeHtml(p.unit):''}</td></tr>`;
            }
            const target = Number(p.targetQty||0);

            return `<tr>
              <td>${escapeHtml(p.name)}</td>
              <td class="right num" style="font-weight:600;">${qty||'—'}${p.unit?' '+escapeHtml(p.unit):''}</td>
              <td class="right num" style="color:var(--muted);">${target||'—'}</td>
              <td>${target>0
                ? `<div style="display:flex;align-items:center;gap:8px;">
                     <div style="flex:1;background:var(--line-soft);border-radius:6px;height:8px;overflow:hidden;min-width:60px;">
                       <div style="height:100%;width:${pct}%;background:${qty>=target?'var(--accent)':'var(--warn)'};"></div>

let draftLaborTiers = [];
function openProductModal(editId){
  const existing = editId ? products.find(p=>p.id===editId) : null;
  draftLaborTiers = existing ? productLaborTiers(existing).map(t=>({...t})) : [{minQty:0, rate:0}];

    <div class="field-row">
      <div class="field"><label>基础成本 (RM)</label><input id="p_base" type="number" step="0.0001" value="${existing?existing.baseCost:''}" placeholder="0.00" oninput="updateProductCostPreview()"></div>
      <div class="field"><label>Other (RM,选填)</label><input id="p_other" type="number" step="0.0001" value="${existing?(existing.otherCost||''):''}" placeholder="0.00" oninput="updateProductCostPreview()"></div>
    </div>

      <button class="btn btn-sm" onclick="addLaborTier()">+ 新增门槛</button>
    </div>
    <div class="hint" id="productCostPreview" style="margin-top:10px;">单位成本合计(未达任何门槛时):RM 0.00</div>
    <div class="field" style="margin-top:14px;"><label>月度目标销量(选填)</label><input id="p_target" type="number" step="1" value="${existing?(existing.targetQty||''):''}" placeholder="如 6000"></div>
    <div class="hint" style="margin-top:6px;">基础成本、Other一旦录入发票就会锁定快照,不会因为你之后改动而变化。<b>人工费不同</b>:因为是按月度总销量查表,当月已经录入的发票,人工费会跟着当月最新的累计销量自动重新计算。DC Charges、Scan Rebate这类因客户而异的扣款,请照旧去"扣款"标签录入并关联对应发票。</div>
  `;
  showModal(existing?'编辑产品':'新增产品', body, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-accent" onclick="submitProduct('${editId||''}')">保存</button>`);
  setTimeout(updateProductCostPreview, 0);
}
function renderLaborTiersRows(){
  const sorted = [...draftLaborTiers].sort((a,b)=>a.minQty-b.minQty);
  return sorted.map((t,i)=>`
    <div class="field-row" style="align-items:center;margin-bottom:6px;">
      <div style="width:120px;font-size:12.5px;color:var(--muted);flex:none;">
        ${i===0 ? '基础(0起)' : `<input type="number" value="${t.minQty}" placeholder="门槛数量" onchange="updateLaborTier(${i},'minQty',this.value)" style="width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;">`}
      </div>
      <input type="number" step="0.0001" value="${t.rate}" placeholder="人工费 RM" onchange="updateLaborTier(${i},'rate',this.value)" style="flex:1;">
      ${i>0 ? `<button class="btn btn-ghost btn-sm" onclick="removeLaborTier(${i})">删除</button>` : ''}
    </div>
  `).join('');
}
function addLaborTier(){
  draftLaborTiers.push({minQty:0, rate:0});
  document.getElementById('laborTiersList').innerHTML = renderLaborTiersRows();
  updateProductCostPreview();
}
function removeLaborTier(idx){
  const sorted = [...draftLaborTiers].sort((a,b)=>a.minQty-b.minQty);
  const target = sorted[idx];
  draftLaborTiers = draftLaborTiers.filter(t=>t!==target);
  document.getElementById('laborTiersList').innerHTML = renderLaborTiersRows();
  updateProductCostPreview();
}
function updateLaborTier(idx, field, value){
  const sorted = [...draftLaborTiers].sort((a,b)=>a.minQty-b.minQty);
  const target = sorted[idx];
  target[field] = Number(value)||0;
  updateProductCostPreview();
}
function updateProductCostPreview(){
  const base = Number(document.getElementById('p_base')?.value)||0;
  const other = Number(document.getElementById('p_other')?.value)||0;
  const baseLabor = [...draftLaborTiers].sort((a,b)=>a.minQty-b.minQty)[0]?.rate || 0;
  const el = document.getElementById('productCostPreview');
  if(el) el.textContent = '单位成本合计(未达任何门槛时):' + fmtMoney(base+baseLabor+other);
}
async function submitProduct(editId){
  const name = document.getElementById('p_name').value.trim();
  const unit = document.getElementById('p_unit').value.trim();
  const baseCost = Number(document.getElementById('p_base').value);
  const otherCost = Number(document.getElementById('p_other').value)||0;
  const targetQty = Number(document.getElementById('p_target').value)||0;
  const laborTiers = [...draftLaborTiers].sort((a,b)=>a.minQty-b.minQty);
  if(!name){ toast('请输入产品名称'); return; }
  if(!baseCost || baseCost<0){ toast('请输入有效的基础成本'); return; }
  if(editId){
    const p = products.find(x=>x.id===editId);
    p.name=name; p.unit=unit; p.baseCost=baseCost; p.otherCost=otherCost; p.targetQty=targetQty; p.laborTiers=laborTiers;
    delete p.laborCost;
  } else {
    products.push({id:uid(), name, unit, baseCost, otherCost, targetQty, laborTiers});
  }
  await saveProducts();
  closeModal();
  if(currentView==='products') renderProductsPage();
  toast('已保存');
}
function deleteProduct(id){
  askConfirm('确定要删除这个产品吗?已经录入过的发票成本明细不受影响,只是以后没法再选它了。', async ()=>{
    products = products.filter(p=>p.id!==id);
    await saveProducts();
    renderProductsPage();
    toast('产品已删除');
  });
}

function invBadge(id,inv){
  const st = invoiceStatus(id,inv);
  const label = st.status==='settled'?'已结清':st.status==='partial'?'部分结清':'未结清';
  const cls = st.status==='settled'?'ok':st.status==='partial'?'warn':'neutral';
  return `<span class="badge ${cls}">${label}</span>`;
}
function invRefLabel(id,r){
  const ids = getRecordInvoiceIds(r);
  if(!ids.length) return '—';
  const labels = ids.map(iid=>{
    const inv = getInvoiceById(id,iid);
    return inv ? (inv.invNo || fmtDate(inv.date)) : '(已删除)';
  });
  return escapeHtml(labels.join(', '));
}

function customerSalesForMonth(monthKey){
  return customers.map(c=>{
    const d = dataCache[c.id];
    const invs = (d?.invoices||[]).filter(inv=>inv.date && inv.date.slice(0,7)===monthKey);
    const sales = invs.reduce((s,inv)=>s+Number(inv.amount||0),0);
    return {c, sales, count:invs.length};
  }).filter(x=>x.count>0);
}
// 某个月,每个客户 x 每个产品 各卖了多少数量:{ customerId: { productId: qty } }
function customerProductQtyForMonth(monthKey){
  const result = {};
  customers.forEach(c=>{
    const d = dataCache[c.id];
    if(!d) return;
    d.invoices.forEach(inv=>{
      if(!inv.date || inv.date.slice(0,7)!==monthKey) return;
      (inv.costItems||[]).forEach(ci=>{
        if(!ci.productId) return;
        if(!result[c.id]) result[c.id] = {};
        result[c.id][ci.productId] = (result[c.id][ci.productId]||0) + (Number(ci.qty)||0);
      });
    });
  });
  return result;
}

function exportMonthlySummaryCSV(){
  const monthKey = monthlySummaryMonth;
  const custSales = customerSalesForMonth(monthKey).sort((a,b)=>b.sales-a.sales);
  const qtyMap = salesQtyByProduct('month', monthKey);
  const sortedProducts = [...products].sort((a,b)=>a.name.localeCompare(b.name));
  const custProductQty = customerProductQtyForMonth(monthKey);
  const lines = [`月度汇总,${monthKey}`,''];
  lines.push('客户,发票笔数,销售额');
  custSales.forEach(x=>lines.push([x.c.name, x.count, x.sales].join(',')));
  lines.push('');
  lines.push('产品,数量(全公司合计)');
  sortedProducts.forEach(p=>lines.push([p.name, qtyMap[p.id]||0].join(',')));
  lines.push('');
  lines.push('客户 x 产品 数量明细');
  lines.push(['客户', ...sortedProducts.map(p=>p.name), '总数量'].join(','));
  customers.filter(c=>custProductQty[c.id]).forEach(c=>{
    const row = custProductQty[c.id];
    const total = Object.values(row).reduce((s,v)=>s+v,0);
    lines.push([c.name, ...sortedProducts.map(p=>row[p.id]||0), total].join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, `月度汇总_${monthKey}.csv`);
}

async function submitShippingBatch(editId){

  const record = {id: existing?existing.id:uid(), date, totalCost, method, note, items};

      <div class="field"><label>备注 / 银行流水号(选填)</label><input id="f_note" placeholder="如 OROCBC 24/05/012" value="${escapeHtml(v('note'))}"></div>
    `;
  }
  const title = (existing?'编辑 · ':'') + TAB_META[key].addLabel.replace('+ ','');
  showModal(title, body, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-accent" onclick="submitRecord('${key}','${editId||''}')">${existing?'更新':'保存'}</button>`);
  setTimeout(updateInvoiceLinkHint, 0);
}
function editRecord(key,id){ openRecordModal(key,id); }
function onSampleToggle(){
  const chk = document.getElementById('f_isSample');
  const amt = document.getElementById('f_amount');
  draftIsSample = chk.checked;
  if(chk.checked){
    amt.value = '0';
    amt.disabled = true;
  } else {
    amt.disabled = false;
    amt.value = '';
    amt.focus();
  }
}
function onTypeSelectChange(){
  const sel = document.getElementById('f_type_select');
  const manual = document.getElementById('f_type_manual');
  if(sel.value==='__manual__'){
    manual.style.display='block';
    manual.focus();
  } else {
    manual.style.display='none';
  }
}
async function submitRecord(key, editId){
  const c = getCustomer(currentCustomerId);
  const d = dataCache[c.id];
  const date = document.getElementById('f_date').value || todayISO();
  const isSampleInvoice = key==='invoices' && document.getElementById('f_isSample')?.checked;
  const amount = isSampleInvoice ? 0 : Number(document.getElementById('f_amount').value);
  if(!isSampleInvoice && (!amount || amount<=0)){ toast('请输入有效金额'); return; }
  const existing = editId ? d[key].find(r=>r.id===editId) : null;
  const rid = existing ? existing.id : uid();
  const invoiceIds = Array.from(document.querySelectorAll('.inv-check:checked')).map(el=>el.value);

  let record;
  if(key==='invoices'){
    record = {id:rid, date, invNo:document.getElementById('f_invNo').value.trim(), amount, isSample:!!isSampleInvoice, costItems: draftCostItems.map(ci=>({...ci}))};
    draftCostItems = [];
    draftCostItemsFor = null;
    draftIsSample = false;
  } else if(key==='deductions'){
    const sel = document.getElementById('f_type_select').value;
    const typeName = sel==='__manual__' ? document.getElementById('f_type_manual').value.trim() : sel;
    if(!typeName){ toast('请选择或输入扣款类型'); return; }
    if(!d.types.includes(typeName)) d.types.push(typeName);
    record = {id:rid, date, typeName, invoiceIds, ref:document.getElementById('f_ref').value.trim(), note:document.getElementById('f_note').value.trim(), amount};
  } else if(key==='returns'){
    record = {id:rid, date, code:document.getElementById('f_code').value, product:document.getElementById('f_product').value.trim(), qty:document.getElementById('f_qty').value||null, invoiceIds, amount};
  } else if(key==='payments'){
    record = {id:rid, date, invoiceIds, note:document.getElementById('f_note').value.trim(), amount};
  }

  if(existing){
    const idx = d[key].findIndex(r=>r.id===editId);
    d[key][idx] = record;
  } else {
    d[key].push(record);
  }
  await saveCustData(c.id);
  closeModal();
  renderCustomerPage();
  renderCustList();
  toast(existing?'已更新':'已保存');
}

/* ============================================================
   新增客户 Modal
============================================================ */
function agentSelectField(selectedId, idPrefix){
  const opts = agents.map(a=>`<option value="${a.id}" ${selectedId===a.id?'selected':''}>${escapeHtml(a.name)}</option>`).join('');
  return `
    <div class="field">
      <label>Agent</label>
      <select id="${idPrefix}_select" onchange="onAgentSelectChange('${idPrefix}')">
        ${opts}
        <option value="">— 未分配 —</option>
        <option value="__manual__">✎ 新增Agent…</option>
      </select>
      <input id="${idPrefix}_manual" placeholder="输入新的Agent名称" style="display:none;margin-top:8px;">
    </div>
  `;
}
function onAgentSelectChange(idPrefix){
  const sel = document.getElementById(idPrefix+'_select');
  const manual = document.getElementById(idPrefix+'_manual');
  if(sel.value==='__manual__'){ manual.style.display='block'; manual.focus(); }
  else{ manual.style.display='none'; }
}
async function resolveAgentSelection(idPrefix){
  const sel = document.getElementById(idPrefix+'_select').value;
  if(sel==='__manual__'){
    const name = document.getElementById(idPrefix+'_manual').value.trim();
    if(!name) return null;
    const existing = agents.find(a=>a.name.toLowerCase()===name.toLowerCase());
    if(existing) return existing.id;
    const newAgent = {id:uid(), name};
    agents.push(newAgent);
    await saveAgents();
    renderAgentFilterSelect();
    return newAgent.id;
  }
  return sel || null;
}
function openAgentManageModal(){
  const body = `
    <p class="hint" style="margin:0 0 12px;">改名字直接在输入框改完按Tab或点别处即可保存。</p>
    <div id="agentManageList">${renderAgentManageRows()}</div>
    <div class="field-row" style="margin-top:14px;">
      <div class="field"><input id="newAgentInput" placeholder="新增Agent名称"></div>
      <button class="btn btn-sm" style="height:37px;" onclick="addAgentManually()">添加</button>
    </div>
  `;
  showModal('管理 Agent', body, `<button class="btn" onclick="closeModal()">关闭</button>`);
}
function renderAgentManageRows(){
  if(!agents.length) return `<div class="hint">还没有Agent,在下面新增一个</div>`;
  return agents.map(a=>{
    const count = customers.filter(c=>c.agentId===a.id).length;
    return `<div class="field-row" style="align-items:center;margin-bottom:8px;">
      <input value="${escapeHtml(a.name)}" style="flex:1;" onchange="renameAgent('${a.id}', this.value)">
      <span class="hint" style="white-space:nowrap;margin:0 8px;">${count}个客户</span>
      <button class="btn btn-ghost btn-sm" onclick="deleteAgent('${a.id}')">删除</button>
    </div>`;
  }).join('');
}
async function renameAgent(id, newName){
  newName = newName.trim();
  if(!newName) return;
  const a = agents.find(x=>x.id===id);
  if(a){
    a.name = newName;
    await saveAgents();
    renderAgentFilterSelect();
    renderCustList();
    toast('已更新');
  }
}
async function addAgentManually(){
  const input = document.getElementById('newAgentInput');
  const name = input.value.trim();
  if(!name) return;
  agents.push({id:uid(), name});
  await saveAgents();
  input.value='';
  document.getElementById('agentManageList').innerHTML = renderAgentManageRows();
  renderAgentFilterSelect();
  toast('已新增');
}
function deleteAgent(id){
  const count = customers.filter(c=>c.agentId===id).length;
  const msg = count>0 ? `这个Agent名下还有${count}个客户,删除后这些客户会变成"未分配"。确定要删除吗?` : '确定要删除这个Agent吗?';
  askConfirm(msg, async ()=>{
    agents = agents.filter(a=>a.id!==id);
    customers.forEach(c=>{ if(c.agentId===id) c.agentId=null; });
    await saveAgents();
    await saveCustomers();
    if(agentFilter===id) agentFilter=null;
    renderCustList();
    if(currentView==='dashboard') renderDashboard();
    toast('Agent已删除');
  });
}
function openCustomerModal(){
  const body = `
    <div class="field"><label>客户名称</label><input id="nc_name" placeholder="如 7-Eleven"></div>
    ${agentSelectField(agentFilter || (agents[0]?.id||null), 'nc_agent')}
    <div class="field-row">
      <div class="field"><label>账期(天)</label><input id="nc_term" type="number" value="30"></div>
      <div class="field"><label>信用额度 (RM,选填)</label><input id="nc_creditLimit" type="number" min="0" step="100" placeholder="不填 = 不设限"></div>
    </div>
    <div class="field"><label>备注(选填)</label><input id="nc_note"></div>
  `;
  showModal('新增客户', body, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-accent" onclick="submitCustomer()">创建</button>`);
}
async function submitCustomer(){
  const name = document.getElementById('nc_name').value.trim();
  if(!name){ toast('请输入客户名称'); return; }
  const agentId = await resolveAgentSelection('nc_agent');
  const c = {id:uid(), name, agentId, termDays:Number(document.getElementById('nc_term').value)||30, creditLimit:Number(document.getElementById('nc_creditLimit').value)||0, note:document.getElementById('nc_note').value.trim(), createdAt:todayISO()};
  customers.push(c);
  dataCache[c.id] = blankCustData();
  await saveCustomers();
  await saveCustData(c.id);
  closeModal();
  openCustomer(c.id);
  toast('客户已创建');
}

/* ============================================================
   Modal 基础
============================================================ */
function showModal(title, body, foot){
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${foot}</div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target.id==='overlay') closeModal();
});

/* ============================================================
   CSV 导出
============================================================ */
function exportCSV(custId,key){
  const c = getCustomer(custId);
  const d = dataCache[custId];
  const rows = d[key];
  let lines=[];
  if(key==='invoices'){
    lines.push(['date','invNo','amount(sales)','cost','shipping','deduction_return','profit','margin%'].join(','));
    rows.forEach(r=>{
      const p = invoiceProfit(custId, r);
      lines.push([r.date, r.invNo||'', r.amount, p.cost.toFixed(2), p.shipping.toFixed(2), p.dedRet.toFixed(2), p.profit.toFixed(2), p.margin===null?'':p.margin.toFixed(1)].map(v=>{
        v = String(v).replace(/"/g,'""');
        return (v.includes(',')||v.includes('"')) ? `"${v}"` : v;
      }).join(','));
    });
  } else {
    let header=[];
    if(key==='deductions'){ header=['date','typeName','ref','amount','note']; }
    if(key==='returns'){ header=['date','code','product','qty','amount']; }
    if(key==='payments'){ header=['date','note','amount']; }
    lines.push(header.join(','));
    rows.forEach(r=>{
      lines.push(header.map(h=>{
        let v = r[h]??'';
        v = String(v).replace(/"/g,'""');
        if(v.includes(',')||v.includes('"')) v = `"${v}"`;
        return v;
      }).join(','));
    });
  }
  const blob = new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${c.name}_${key}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
